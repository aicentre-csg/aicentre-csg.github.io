- date: May, 2026
  headline: >-
    **Prominent speakers at the AI Centre:** The AI Centre has welcomed leading international researchers including Moshe Y. Vardi, Clark Barrett, and
    Byron Cook, highlighting the Centre’s growing visibility in automated reasoning, formal methods, neurosymbolic AI, and trustworthy AI.
- date: May, 2026
  headline: >-
    **Moshe Y. Vardi visits the AI Centre:** The AI Centre welcomed Prof. Moshe Y. Vardi, University Professor at Rice University, whose research
    spans automated reasoning, logic, verification, database theory, machine learning, and the social impact of technology. <a
    href='https://www.cs.rice.edu/~vardi/'>Read more</a>.
- date: May, 2026
  headline: >-
    **Clark Barrett visits the AI Centre:** The AI Centre welcomed Prof. Clark Barrett from Stanford University, whose research interests include
    automated reasoning, SMT, formal verification, AI safety, and AI-assisted verification. <a href='https://theory.stanford.edu/~barrett/'>Read
    more</a>.
- date: May, 2026
  headline: >-
    **NeuroSymbolic AI and formal reasoning:** The AI Centre continues to engage with international developments in neurosymbolic AI, including work
    connecting LLMs, Lean, automated reasoning, and verified computer science. <a href='https://www.cslib.io/'>Read more about CSLib</a>.
- date: May, 2026
  headline: >-
    **Byron Cook and neurosymbolic AI at Amazon:** The AI Centre highlighted recent industrial developments in neurosymbolic AI, including Amazon’s
    use of automated reasoning in AI systems and robotics. <a
    href='https://www.wsj.com/articles/meet-neurosymbolic-ai-amazons-method-for-enhancing-neural-networks-620dd81a'>Read more</a>.
- date: May, 2026
  headline: >-
    **GUARD Project phase two awarded:** The second phase of the GUARD Project, funded by The Alan Turing Institute, has been awarded. GUARD brings
    more than £260k to the Research Centre in AI for research on interoperable and trustworthy knowledge graphs for defence and national security AI.
    <a href='https://ernestojimenezruiz.github.io/projects/guard/'>Read more</a>.
- date: May, 2026
  headline: >-
    **CEREBRA-AI project announced:** The EU-funded project CEREBRA-AI will kick off in September 2027. The Research Centre in AI will contribute
    expertise in Neuro-Symbolic AI, Knowledge Graphs, Continual Learning, and Natural Language Processing. <a
    href='https://neuro-symbolic-ai-medicine.github.io/projects/cerebra/'>Read more</a>.
- date: May, 2026
  headline: >-
    **RAI for Ukraine collaboration leads to EACL 2026 publication:** Members of the AI Research Centre participated in the RAI for Ukraine programme,
    mentoring three students from Ukrainian Catholic University. The collaboration has led to a publication at EACL 2026. <a
    href='https://airesponsibly.net/RAIforUkraine/'>Read more</a>.
- date: 18 May, 2026
  headline: >-
    **AI Centre engagement with Imperial Frontier AI Lab:** Members of the AI Centre attended the launch of the Thomson Reuters–Imperial Frontier AI
    Research Lab, a new initiative focused on trustworthy AI systems, foundational machine learning, safety, and societal impact. <a
    href='https://www.imperial.ac.uk/frontier-ai'>Read more</a>.
- date: 30 April, 2026
  headline: >-
    **Solid Symposium 2026 hosted at City St George’s:** The Open Data Institute, in collaboration with the Research Centre in AI, hosted the 4th
    Solid Symposium at City St George’s, featuring speakers including Sir Tim Berners-Lee and Oshani Seneviratne. <a href='https://sosy2026.eu/'>Read
    more</a>.
- date: 30 April, 2026
  headline: >-
    **AI Centre celebrates Sir Tim Berners-Lee visit:** City St George’s hosted Sir Tim Berners-Lee as part of Solid Symposium 2026, bringing together
    academia, industry, government, and the wider research community to explore the next chapter for data on the Web. <a
    href='https://sosy2026.eu/'>Read more</a>.
- date: 17 March, 2026
  headline: >-
    **Wallenberg Advanced Scientific Forum 2026:** Prof. Artur d’Avila Garcez gave a talk at the Wallenberg Advanced Scientific Forum on Foundations
    of NeuroSymbolic Artificial Intelligence, held at Rånäs Castle, Stockholm. <a
    href='https://wasp-sweden.org/wallenberg-advanced-scientific-forum-2026/'>Read more</a>.
- date: February, 2026
  headline: >-
    **AI evidence synthesis workshop report published:** The AI evidence synthesis workshop report from earlier this year is now available through
    City St George’s Open Access. <a href='https://openaccess.city.ac.uk/id/eprint/36801/1/JUL_WP1_Workshop%202%20report_10February2026.pdf'>Read the
    report</a>.
- date: 2 February, 2026
  headline: >-
    **Tech Talks Daily podcast:** Prof. Artur d’Avila Garcez joined Tech Talks Daily to discuss why powerful AI systems still struggle to explain
    their decisions, repeat mistakes, and maintain trust as AI takes on greater responsibility. <a
    href='https://open.spotify.com/episode/1wrHOV8tOFkBe1kfXVPaen'>Listen to the episode</a>.
- date: 7 January, 2026
  headline: '**AI Centre Seminar:** Pedro Giesteria Cotovio will deliver an external seminar.'
