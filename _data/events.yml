- date: 23 June, 2026 18:00 BST
  title: >-
    Shaping Tomorrow - The Future of Data Science in the Age of AI.  Short talks and discussion with academics and practitioner/alunmi of the MSc in
    Data Science
  type: seminar
  speaker: Dr Tilman Weyde, Prof. Artur Garcez, Aishwarya Shekar
  location: Online
  link: https://www.citystgeorges.ac.uk/news-and-events/events/2026/june/the-future-of-data-science-in-the-age-of-ai
  description: >-
    In the age of artificial intelligence, the world as we know it is evolving, and we’re looking towards a future where AI will increasingly be
    working alongside people, opening up new opportunities for all generations. So, how can data scientists help shape the future and will AI replace
    Human Data Scientists?


    Hosted by Dr Tillman Weyde, Reader in the Department of Computer Science at City St George's, this event will discover the evolving role of
    artificial intelligence and the future of data science. The event will include expert talks from an academic and an industry expert. From
    academia, Prof Artur Garcez, Professor of Computer Science at City St George's, will discuss data science, AI, machine learning and the
    disruption, productivity and big skills reset surrounding those topics.


    Following the two introductory talks, there will be a panel discussion. This event will give participants an excellent opportunity to engage in
    expert talks and thought-provoking conversation with alumni, prospective students, students and academics.


    The panel discussion will be followed by a Q&A, where you are invited to pose your own questions and share your views.
