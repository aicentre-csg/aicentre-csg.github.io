- title: "Bijective BWT based compression schemes"
  image: p1.png
  description: >
    We investigate properties of the bijective Burrows-Wheeler transform (BBWT), showing relationships between bidirectional macro schemes and maximal character runs. We also introduce new insights into BBWT vs standard BWT with theoretical separations.
