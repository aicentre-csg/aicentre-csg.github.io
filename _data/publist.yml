- title: ' Deep Learning Agents and the Emergence of Compositional Languages: Approaches, Inductive Biases and Measurement'
  authors: Nicholas Bailey, Chris Child, Tillman Weyde
  journal: Journal of Artificial Intelligence Research (JAIR)
  year: '2026'
  volume: '86'
  pages: 6:1-6:43
  doi: 'https://doi.org/10.1613/jair.1.17302 '
  link: https://jair.org/index.php/jair/article/view/17302/27309
  abstract: >-
    Compositional symbol-forming and symbol-relating behaviors in deep learning or neuro-symbolic systems have been repeatedly recommended as part of a
    solution to the shortcomings of current state-of-the-art artificial intelligence. Studying how compositional languages can emerge between tabula
    rasa deep learning agents may help us understand how to make artificial neural networks represent unstructured, continuous input data in terms of
    combinations of discrete symbols.
