- date: "2025-11-12T13:00:00+00:00"
  title: "AI Services for Curating Biomedical Knowledge Graphs"
  speaker: "Emanuele Cavalleri"
  affiliation: "University of Milan"
  location: "R105, Franklin Building and online"
  abstract: "Presents SchemaLink, a framework of LLM-driven services for extracting and validating plausible facts for biomedical knowledge graphs, applied to RNA-KG (about 6.5 million nodes and 100 million edges), including metrics to detect hallucinated or low-quality triples."

- date: "2026-02-02T14:00:00+00:00"
  title: "Translating Biomedical Cypher Queries via LLM-driven Approaches: An Empirical Evaluation"
  speaker: "Marco Mesiti"
  affiliation: "University of Milan"
  location: "C316"
  abstract: "Introduces a manually annotated benchmark of 2,500 natural-language/Cypher query pairs grounded in RNA-KG and evaluates prompt-based and fine-tuned LLMs on the Text2Cypher task, at both syntactic and semantic level (joint work with E. Cavalleri and N. Bou Kanaan)."

- date: "2026-02-27T14:00:00+00:00"
  title: "When Good Metrics Lie: What the Listener Acoustic Personalisation Challenge Revealed About AI in Spatial Audio"
  speaker: "Aidan Hogg"
  affiliation: "Queen Mary University of London"
  location: "A107, College Building and online"
  abstract: "Discusses findings from the Listener Acoustic Personalisation Challenge 2024: models with excellent objective log-spectral distortion scores often failed to preserve perceptually meaningful spatial cues, with implications for evaluating AI systems that model human perception."

- date: "2026-03-20T14:30:00+00:00"
  title: "Towards counterfactual explanations for sequential decision-making problems"
  speaker: "Francesco Leofante"
  affiliation: "Imperial College London"
  location: "A107, College Building"
  abstract: "Presents three recent proposals for generating counterfactual explanations in sequential decision-making: automated planning, neuro-symbolic multi-agent systems, and Markov decision processes."
  video_link: "https://echo360.org.uk/section/dd5f06ba-6014-4b00-8766-9a9572f016af/public"

- date: "2026-04-17T14:00:00+01:00"
  title: "Explorations of the Softmax Space: Knowing When the Neural Network Doesn't Know"
  speaker: "Daniel Sikar"
  affiliation: "City St George's, University of London"
  location: "A214, College Building"
  abstract: "Uses the full softmax output to build n-dimensional clusters during training and derives a lightweight metric that quantifies prediction confidence at runtime."

- date: "2026-05-15T13:00:00+01:00"
  title: "Physics-informed neural networks for cardiac and brain function"
  speaker: "Marta Varela"
  affiliation: "St George's, University of London"
  location: "C308, Tait Building and online"
  abstract: "Presents research using physics-informed neural networks (PINNs) to characterise the electrical properties of the heart and to estimate biomarkers of brain function."
  video_link: "https://echo360.org.uk/section/ce95b99d-1814-43a4-8d5b-7a52d850323b/public"

- date: "2026-05-22T14:00:00+01:00"
  title: "Automating Biological Laboratory Discovery"
  speaker: "Gabriel Reder"
  affiliation: "The Alan Turing Institute"
  location: "C308, Tait Building"
  abstract: "Discusses physical and digital automation of laboratory-based biological discovery, integrating experimentation, analysis, informatics and modelling, with applications in microbiology and analytical chemistry using generative and symbolic AI and laboratory robotics."

- date: "2026-06-24T14:30:00+01:00"
  title: "Neurosymbolic AI: From Ontological Foundations to Genomic Discovery"
  speaker: "Artur d'Avila Garcez, Alberto Ferreira De Souza, Giancarlo Guizzardi, Ernesto Jiménez-Ruiz"
  affiliation: "City St George's; UFES; University of Twente"
  location: "AG07b, College Building and online"
  abstract: "Mini-workshop on neurosymbolic AI with talks by Prof. Artur d'Avila Garcez (City), Prof. Alberto Ferreira De Souza (UFES), Prof. Giancarlo Guizzardi (University of Twente) and Dr Ernesto Jiménez-Ruiz (City)."

- date: "2026-08-12T11:00:00+01:00"
  title: "On Neurosymbolic approaches for Assured Autonomy"
  speaker: "Alberto Speranzon"
  affiliation: "Lockheed Martin"
  location: "Online (Microsoft Teams)"
  abstract: "Presents neurosymbolic techniques for assuring the behaviour of autonomous systems: relational abstractions of decision-making with guarantees for reinforcement-learning policies, runtime monitoring, and conformal prediction for evaluating temporal-logic requirements. Co-hosted with the Centre for Software Reliability."

